name: Inspect WeatherNext 3 access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wn3-inspect
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reader dependencies
        run: python -m pip install -r wn3/requirements.txt

      - name: Inspect approved statistics source
        env:
          WN3_ACCESS_TOKEN: ${{ secrets.WN3_ACCESS_TOKEN }}
        run: python -m wn3.run --inspect
