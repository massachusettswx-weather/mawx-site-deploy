<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>MassachusettsWx Models</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">
    <div class="brand-block">
        <h1>MassachusettsWx Models</h1>

        <div class="header-meta">
            <span id="modelText">NCEP GFS</span>
            <span class="dot">•</span>
            <span id="cycleText">Loading latest cycle...</span>

            <span
                id="availabilityBadge"
                class="availability-badge loading"
            >
                Loading
            </span>
        </div>
    </div>
</header>
<nav class="section-tabs" aria-label="Site sections">
    <a class="section-tab active" href="./">
        Global
    </a>

    <span class="section-tab disabled">
        Ensemble
    </span>

    <span class="section-tab disabled">
        Mesoscale
    </span>

    <span class="section-tab disabled">
        Hurricane
    </span>

    <span class="section-tab disabled">
        Climate
    </span>

    <a
        class="section-tab analysis-tab"
        href="/site/current-analysis.html"
    >
        Current Analysis
    </a>
</nav>



<main>

    <section class="toolbar">

        <div class="control-group">
            <label for="modelSelect">
                Model
            </label>

            <select id="modelSelect">
                <option value="weathernext2_mean">
                    WeatherNext 2
                </option>

                <option value="gfs" selected>
                    NCEP GFS
                </option>

                <option value="ifs">
                    ECMWF IFS
                </option>

                <option value="aifs">
                    ECMWF AIFS
                </option>

                <option value="fnv3">
                    FNV3 Cyclones
                </option>

                <option value="fnv3_large">
                    FNV3-L Cyclones
                </option>
            </select>
        </div>


        <div class="control-group">
            <label for="cycleSelect">
                Cycle
            </label>

            <select id="cycleSelect">
                <option value="latest">
                    Latest
                </option>
            </select>
        </div>


        <div class="control-group">
            <label for="regionSelect">
                Region
            </label>

            <select id="regionSelect">
            </select>
        </div>


        <div class="control-group product-control">
            <label for="productSelect">
                Product
            </label>

            <select id="productSelect">
            </select>
        </div>


        <div class="control-group">
            <label for="speedSelect">
                Animation
            </label>

            <select id="speedSelect">
                <option value="1200">
                    Slow
                </option>

                <option
                    value="800"
                    selected
                >
                    Normal
                </option>

                <option value="450">
                    Fast
                </option>
            </select>
        </div>

    </section>


    <section class="viewer-layout">

        <div class="viewer-main">

            <section class="viewer-topbar">

                <div class="nav-buttons">

                    <button
                        id="prevButton"
                        type="button"
                        title="Previous forecast hour"
                    >
                        ◀ Previous
                    </button>

                    <button
                        id="playButton"
                        type="button"
                        title="Play / pause animation"
                    >
                        ▶ Play
                    </button>

                    <button
                        id="nextButton"
                        type="button"
                        title="Next forecast hour"
                    >
                        Next ▶
                    </button>

                </div>


                <div class="frame-meta">
                    <span id="productText">
                        —
                    </span>

                    <span class="dot">•</span>

                    <span id="hourText">
                        —
                    </span>
                </div>

            
                <div class="export-buttons">
                    <button id="runGifButton" type="button" title="Download the selected forecast run as an animated GIF">Run GIF</button>
                    <button id="trendGifButton" type="button" title="Download the selected forecast hour across previous model cycles">Trend GIF</button>
                </div>
</section>


            <section class="forecast-scrubber-panel">

                <div class="forecast-scrubber-header">

                    <span>
                        Forecast Timeline
                    </span>

                    <strong id="scrubberHourText">
                        —
                    </strong>

                </div>

                <input
                    id="forecastScrubber"
                    class="forecast-scrubber"
                    type="range"
                    min="0"
                    max="0"
                    value="0"
                    step="1"
                    aria-label="Forecast hour timeline"
                    disabled
                >

                <div class="forecast-scrubber-scale">

                    <span id="scrubberStartText">
                        —
                    </span>

                    <span>
                        Drag to move through available frames
                    </span>

                    <span id="scrubberEndText">
                        —
                    </span>

                </div>

            </section>

            <section class="map-wrapper">

                <div
                    id="loadingText"
                    class="loading"
                >
                    Loading map...
                </div>

                <img
                    id="mapImage"
                    alt="Weather model forecast map"
                >

            </section>


            


            <section class="viewer-footer">

                <span>
                    Keyboard:
                    <strong>←</strong>
                    previous,
                    <strong>→</strong>
                    next,
                    <strong>Space</strong>
                    play/pause
                </span>

                <span id="frameCounter">
                    —
                </span>

            </section>

        </div>


        <aside class="forecast-sidebar">

            <div class="forecast-sidebar-header">
                <div class="sidebar-label">
                    Forecast Hour
                </div>

                <div
                    id="selectedHourText"
                    class="selected-hour"
                >
                    —
                </div>
            </div>

            <div
                id="hourGrid"
                class="hour-grid"
            >
            </div>

        </aside>

    </section>

</main>



    <!-- Client-side GIF export -->
    <script src="https://cdn.jsdelivr.net/npm/gif.js.optimized/dist/gif.js"></script>

    <script src="app.js"></script>

</body>
</html>
